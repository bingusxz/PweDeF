# Builds the Windows installer and publishes it as a GitHub Release.
# Installed copies of Acrobatics check these releases and update themselves.
#
# To ship a new version:   npm version patch   (or minor / major)
#                          git push --follow-tags
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check, build, test
        run: |
          npm run build
          npm run test:engine

      - name: Package & publish installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
