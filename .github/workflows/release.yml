# Every push to main = a new release that installed copies download automatically.
#
#   1. Push your changes to main.
#   2. This workflow type-checks, builds and runs the engine tests (a failure stops the release).
#   3. It stamps the version as <major>.<minor>.<build number>, e.g. 0.1.7,
#      builds the Windows installer, and publishes it as a GitHub Release.
#   4. Every installed Acrobatics checks GitHub hourly, downloads the update in the
#      background, and shows "Restart to update".
#
# To start a new minor/major line, change "version" in package.json (e.g. 0.2.0).
# Pushes that only touch docs don't trigger a release.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# Source code lives in this PRIVATE repo; installers are published to the PUBLIC
# repo bingusxz/acrobatics-releases so the app can download updates without a token.
# Needs repo secret RELEASES_TOKEN: a fine-grained token with
# "Contents: Read and write" on bingusxz/acrobatics-releases only.
env:
  HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check, build, test
        run: |
          npm run build
          npm run test:engine

      - name: Set version from build number
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          v="$base.${{ github.run_number }}"
          npm version "$v" --no-git-tag-version --allow-same-version
          echo "Releasing v$v"

      - name: Package & publish installer
        if: env.HAS_RELEASES_TOKEN == 'true'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: Publishing skipped (no RELEASES_TOKEN secret yet)
        if: env.HAS_RELEASES_TOKEN != 'true'
        shell: bash
        run: echo "::warning::Build OK but not published. Add the RELEASES_TOKEN secret (see README → Releasing) to enable auto-update releases."
