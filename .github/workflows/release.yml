# Every push to main = a new release that installed copies download automatically.
#
#   1. Push your changes to main.
#   2. This workflow type-checks, builds and runs the engine tests (a failure stops the release).
#   3. It stamps the version as <major>.<minor>.<build number>, e.g. 0.1.7,
#      builds the Windows installer, and publishes it as a GitHub Release in this repo.
#   4. Every installed Acrobatics checks hourly, downloads the update in the
#      background, and shows "Restart to update".
#
# To start a new minor/major line, change "version" in package.json (e.g. 0.2.0).
# Pushes that only touch docs don't trigger a release.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check, build, test
        run: |
          npm run build
          npm run test:engine

      - name: Set version from build number
        id: ver
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          v="$base.${{ github.run_number }}"
          npm version "$v" --no-git-tag-version --allow-same-version
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing v$v"

      - name: Package installer
        run: npx electron-builder --win --publish never

      # latest.yml is what installed apps read to find updates; it must be uploaded with the .exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Acrobatics v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/Acrobatics-Setup-${{ steps.ver.outputs.version }}.exe
            release/Acrobatics-Setup-${{ steps.ver.outputs.version }}.exe.blockmap
            release/latest.yml
